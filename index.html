<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator(Abdi_J)</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="brand-logo">

    <img src="logo.png" alt="Abdi_J logo">

</div>

    

    

<div class="container">

    <div class="row">

        <input type="range" name="" min="20" max="200" value="20" id="weight">

        <span id="weight-val">20 KG</span>

    </div>





       <div class="row">

        <input type="range" name="" min="100" max="250" value="100" id="height">

        <span id="height-val">100 cm</span>

       </div>



       <p id="result">20.0</p>

       <p id="category">Normal body Weight</p>





</div>

  <!-- Script   -->

   <script src="script.js"></script>

</body>

</html>
